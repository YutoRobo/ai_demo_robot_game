<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase D5 Reproducibility</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.run{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#e0a93c;color:#111;padding:9px 14px;min-height:42px;font-weight:700}.run:disabled{opacity:.55}select{font:inherit;border-radius:8px;padding:7px;background:#242933;color:#fff;border:1px solid #4a515d}#outerStatus{font-size:12px;opacity:.85}iframe{display:block;width:100%;height:calc(100vh - 82px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="runD5" class="run" disabled>Phase D5 実行</button><label>試行数 <select id="runs"><option value="3" selected>3 runs</option><option value="5">5 runs</option></select></label><span id="outerStatus">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d5&v=20260824-d5base01" title="Phase D5 reproducibility"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('runD5'),st=document.getElementById('outerStatus'),runsSel=document.getElementById('runs');
const masterSeeds=[26082407,26082507,26082607,26082707,26082807];
function mean(a){return a.reduce((s,x)=>s+x,0)/Math.max(1,a.length)}function sd(a){const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/Math.max(1,a.length))}
function fmt(x){return (100*x).toFixed(1)+'%'}
frame.addEventListener('load',async()=>{try{const w=frame.contentWindow,d=w.document;const old=d.getElementById('phaseRunBtn');if(old)old.style.display='none';const h=d.querySelector('h1');if(h)h.textContent='Phase D5：D4再現性試験';const p=d.querySelector('h1 + p');if(p)p.textContent='D4のアルゴリズム・Validation・外部Benchmark条件は固定し、進化乱数のmaster seedだけを変えて複数runします。目的は、強い個体が偶然1回だけ見つかったのか、探索法として再現性があるのかを確認することです。';const warn=d.querySelector('.panel:nth-of-type(2) .mini.warn');if(warn)warn.textContent='外部Benchmarkは各runの選択には一切使用しません。同じBenchmarkを全runに使い、run間比較だけを行います。';const extra=d.createElement('div');extra.className='panel';extra.style.marginTop='12px';extra.innerHTML='<h2 style="font-size:17px;margin:0 0 8px">D5 集計</h2><div id="d5Summary" class="mini">実行後にrun間の平均・標準偏差・最小値を表示します。</div><pre id="d5Report" style="white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:48vh;overflow:auto;background:#111317;padding:10px;border-radius:8px"></pre>';d.body.appendChild(extra);st.textContent='D4エンジン確認中…';const src=await fetch('./phase-d4-evolution.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('D4 fetch failed');return r.text()});if(!src.includes("phase-d4-checkpoint-test-v0.1")||!src.includes('const r=rngFactory(26082407)'))throw new Error('D4基準ソースが想定と異なります');w.__d5BaseSource=src;btn.disabled=false;st.textContent='準備完了：3 runs推奨（5 runsも選択可）';}catch(e){console.error(e);st.textContent='初期化失敗：'+(e.message||e)}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow,d=w.document,runCount=Number(runsSel.value)||3;if(!w.__d5BaseSource){st.textContent='D5未準備です';return}btn.disabled=true;runsSel.disabled=true;const results=[];try{for(let i=0;i<runCount;i++){const seed=masterSeeds[i],patched=w.__d5BaseSource.replace("const VERSION='phase-d4-checkpoint-test-v0.1';",`const VERSION='phase-d5-run-${i+1}-seed-${seed}';`).replace('const r=rngFactory(26082407),bs=baselines();',`const r=rngFactory(${seed}),bs=baselines();`);if(patched===w.__d5BaseSource)throw new Error('master seed patch failed');w.__phaseD4=null;w.eval(patched);if(!w.__phaseD4)throw new Error('run engine install failed');st.textContent=`D5 ${i+1}/${runCount} 実行中（seed ${seed}）…`;const r=await w.__phaseD4.run();results.push({run:i+1,masterSeed:seed,pass:r.pass,selectedGeneration:r.selectedCheckpoint?.generation??null,validationWinRate:r.selectedCheckpoint?.champion?.metrics?.winRate??0,validationAvgDamage:r.selectedCheckpoint?.champion?.metrics?.avgDamage??0,testWinRate:r.finalTest?.metrics?.winRate??0,testResolvedRate:r.finalTest?.metrics?.resolvedRate??0,testAvgDamage:r.finalTest?.metrics?.avgDamage??0,testNonCombatRate:r.finalTest?.metrics?.nonCombatRate??1,hash:r.selectedCheckpoint?.champion?.snapshot?.hash??null,weapons:r.selectedCheckpoint?.champion?.snapshot?.weapons??[],testEvaluations:r.counters?.testEvaluations??0,checkpointHashViolations:r.counters?.checkpointHashViolations??-1});await new Promise(q=>setTimeout(q,50));}
const vals=k=>results.map(r=>r[k]);const summary={version:'phase-d5-repro-v0.1',runCount,masterSeeds:results.map(r=>r.masterSeed),allRunsPass:results.every(r=>r.pass&&r.testEvaluations===1&&r.checkpointHashViolations===0),selectedGenerations:results.map(r=>r.selectedGeneration),validationWinRate:{mean:mean(vals('validationWinRate')),sd:sd(vals('validationWinRate')),min:Math.min(...vals('validationWinRate')),max:Math.max(...vals('validationWinRate'))},testWinRate:{mean:mean(vals('testWinRate')),sd:sd(vals('testWinRate')),min:Math.min(...vals('testWinRate')),max:Math.max(...vals('testWinRate'))},testAvgDamage:{mean:mean(vals('testAvgDamage')),sd:sd(vals('testAvgDamage')),min:Math.min(...vals('testAvgDamage')),max:Math.max(...vals('testAvgDamage'))},testNonCombatRate:{mean:mean(vals('testNonCombatRate')),sd:sd(vals('testNonCombatRate')),min:Math.min(...vals('testNonCombatRate')),max:Math.max(...vals('testNonCombatRate'))},runs:results};w.__phaseD5Report=summary;d.getElementById('d5Report').textContent=JSON.stringify(summary,null,2);d.getElementById('d5Summary').textContent=`${runCount} runs完了 / Test勝率 平均 ${fmt(summary.testWinRate.mean)} ± ${fmt(summary.testWinRate.sd)} / 最小 ${fmt(summary.testWinRate.min)} / 平均Damage ${summary.testAvgDamage.mean.toFixed(2)} / NonCombat平均 ${fmt(summary.testNonCombatRate.mean)} / ${summary.allRunsPass?'監査PASS':'監査要確認'}`;st.textContent='Phase D5 完了。D5集計を確認してください。';}catch(e){console.error(e);st.textContent='Phase D5エラー：'+(e.message||e)}finally{btn.disabled=false;runsSel.disabled=false}});
</script></body></html>
