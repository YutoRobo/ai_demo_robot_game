<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D5 Production Equivalence</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,a{font:inherit;border-radius:9px;border:1px solid #4a515d;padding:9px 14px;min-height:42px}button{background:#e0a93c;color:#111;font-weight:700}a{color:#9ecbff;text-decoration:none;background:#242933}#status{font-size:12px;opacity:.85}iframe{display:block;width:100%;height:calc(100vh - 82px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="run" disabled>固定seed照合を実行</button><a href="./?v=20260824-d5ref02">先に本番探索を実行</a><span id="status">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d5compare&v=20260824-d5ref02"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('run'),status=document.getElementById('status');
const D5_PRODUCTION_REFERENCE_KEY='robot-ai-battle-d5-reference-production';
frame.addEventListener('load',async()=>{try{const w=frame.contentWindow,d=w.document;d.getElementById('phaseRunBtn')?.remove();const h=d.querySelector('h1');if(h)h.textContent='D5固定seed：本番と参照試験の完全一致確認';const p=d.querySelector('h1 + p');if(p)p.textContent='本番探索と同じ共通参照定義・同じmaster seed 26082407でD4を再実行し、checkpoint hash・選択世代・武器・Validation/Testを機械的に照合します。';const extra=d.createElement('div');extra.className='panel';extra.innerHTML='<strong>照合結果</strong><pre id="compareReport" style="white-space:pre-wrap;word-break:break-word;background:#0e1013;padding:12px;border-radius:10px"></pre>';d.body.appendChild(extra);const [refSrc,d4Src]=await Promise.all([fetch('./d5-reference-config.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.text()),fetch('./phase-d4-evolution.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.text())]);w.eval(refSrc);if(w.__D5ReferenceConfig?.VERSION!=='d5-reference-config-v0.1')throw new Error('reference config missing');w.__d5CompareSource=d4Src;btn.disabled=false;status.textContent='準備完了。本番探索を1回実行済みなら照合できます。';}catch(e){console.error(e);status.textContent='初期化失敗：'+(e.message||e)}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow,d=w.document,ref=w.__D5ReferenceConfig;btn.disabled=true;try{const savedRaw=localStorage.getItem(D5_PRODUCTION_REFERENCE_KEY);if(!savedRaw)throw new Error('D5固定seed本番結果がありません。最新版の本番ページで強さ優先探索を1回実行してください。');const saved=JSON.parse(savedRaw);if(saved.referenceConfigVersion!==ref.VERSION||Number(saved.masterSeed)!==Number(ref.defaultMasterSeed))throw new Error(`固定seed結果の識別情報が不一致です（保存: ${saved.referenceConfigVersion||'なし'} / seed ${saved.masterSeed??'なし'}）。最新版の本番ページで再実行してください。`);const src=ref.patchD4Source(w.__d5CompareSource,ref.defaultMasterSeed,'phase-d5-production-reference-check');w.__phaseD4=null;w.eval(src);if(!w.__phaseD4)throw new Error('reference engine install failed');status.textContent='固定seed参照試験を実行中…';const r=await w.__phaseD4.run(),snap=r.selectedCheckpoint?.champion?.snapshot,val=r.selectedCheckpoint?.champion?.metrics,test=r.finalTest?.metrics;const reference={masterSeed:ref.defaultMasterSeed,selectedGeneration:r.selectedCheckpoint?.generation,checkpointHash:snap?.hash,weapons:snap?.weapons||[],validationWinRate:val?.winRate||0,testWinRate:test?.winRate||0,testAvgDamage:test?.avgDamage||0};const production={masterSeed:Number(saved.masterSeed),selectedGeneration:saved.selectedGeneration,checkpointHash:saved.checkpointHash,weapons:saved.weapons||[],validationWinRate:saved.validationWinRate,testWinRate:saved.testWinRate,testAvgDamage:saved.testAvgDamage};const same={masterSeed:production.masterSeed===reference.masterSeed,selectedGeneration:production.selectedGeneration===reference.selectedGeneration,checkpointHash:production.checkpointHash===reference.checkpointHash,weapons:JSON.stringify(production.weapons)===JSON.stringify(reference.weapons),validationWinRate:Math.abs((production.validationWinRate||0)-reference.validationWinRate)<1e-12,testWinRate:Math.abs((production.testWinRate||0)-reference.testWinRate)<1e-12,testAvgDamage:Math.abs((production.testAvgDamage||0)-reference.testAvgDamage)<1e-12};const pass=Object.values(same).every(Boolean);const report={version:'d5-production-equivalence-v0.2',referenceConfigVersion:ref.VERSION,pass,same,production,reference};d.getElementById('compareReport').textContent=JSON.stringify(report,null,2);status.textContent=pass?'完全一致 PASS：本番はD5参照実験を再現しています。':'不一致：差分項目を確認してください。';}catch(e){console.error(e);status.textContent='照合エラー：'+(e.message||e)}finally{btn.disabled=false}});
</script></body></html>
