<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase C 小規模進化試験</title>
<style>body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.panel{background:#1b1e24;border:1px solid #353a43;border-radius:14px;padding:14px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#272c34;color:#fff;padding:8px 12px;min-height:40px}pre{white-space:pre-wrap;word-break:break-word;background:#0e1013;padding:12px;border-radius:10px;max-height:62vh;overflow:auto}.mini{font-size:12px;opacity:.78}</style></head>
<body><main id="testRoot"><h1 style="font-size:20px">Phase C：30個体・3クラスタ小規模進化試験</h1><p class="mini">本番300個体探索には接続していません。v0.3構造演算子を使い、世代進化・再クラスタリング・Elite不変性・program hash一致を検証します。</p>
<div class="panel section"><div class="controls"><button id="phaseRun" type="button">Phase C 実行</button><label>CPU <select id="cpu"><option value="12">Compact 12</option><option value="18" selected>Standard 18</option><option value="24">Advanced 24</option></select></label><a href="./" style="color:#9ecbff">ゲームへ戻る</a></div><div id="phaseStatus" style="margin-top:10px">「Phase C 実行」を押してください。</div><div id="evoDetail" class="mini" style="margin-top:8px"></div></div>
<div class="panel"><strong>合格条件</strong><div class="mini" style="margin-top:8px">invalid→evaluation = 0 / Elite hash違反 = 0 / program hash違反 = 0 / MutationとCrossoverの双方が次世代へ生存 / 個体サイズに変化あり / 最終3クラスタが各10個体。</div></div>
<div class="panel"><strong>詳細レポート</strong><pre id="phaseReport">未実行</pre></div>
<button id="optimizeBtn" style="display:none"></button><div id="status" style="display:none"></div></main>
<script>
const root=document.getElementById('testRoot'),optimizeBtn=document.getElementById('optimizeBtn'),statusEl=document.getElementById('status'),evoDetail=document.getElementById('evoDetail');
const dirs=[['U','↑'],['R','→'],['D','↓'],['L','←']];
const chipTypes=[['forward','前進','action'],['back','後退','action'],['turnL','左旋回','action'],['turnR','右旋回','action'],['strafeL','左移動','action'],['strafeR','右移動','action'],['aim','照準','action'],['evade','回避','action'],['weapon1','武器1','action'],['weapon2','武器2','action'],['flagOn','フラグON','action'],['flagOff','フラグOFF','action'],['timerStart','タイマー','action'],['wait','待機','action'],['enemyFront','正面','cond'],['enemyNear','近い','cond'],['enemyFar','遠い','cond'],['enemyLeft','敵左','cond'],['enemyRight','敵右','cond'],['enemyInNarrowFov','狭視野','cond'],['enemyInMediumFov','中視野','cond'],['enemyInWideFov','広視野','cond'],['bulletNear','弾接近','cond'],['bulletLeft','弾左','cond'],['bulletRight','弾右','cond'],['hpLow','HP低下','cond'],['hitRecent','被弾直後','cond'],['lostEnemy','見失い','cond'],['flagSet','フラグON?','cond'],['timer2s','2秒経過','cond'],['wallNear','壁接近','cond'],['canShoot','射撃可','cond'],['enemyFacingMe','敵が自機向き','cond'],['behindEnemy','敵背後','cond'],['enemyWithin100','100以内','cond'],['enemyWithin200','200以内','cond'],['enemyWithin300','300以内','cond'],['weapon1Ammo','武器1残弾','cond'],['weapon2Ammo','武器2残弾','cond']];
function nextCell(index,dir){const x=index%6,y=Math.floor(index/6);if(dir==='U'&&y>0)return index-6;if(dir==='D'&&y<5)return index+6;if(dir==='L'&&x>0)return index-1;if(dir==='R'&&x<5)return index+1;return index;}
function cloneProgram(p){return p.map(c=>c?{...c}:null)}function cpuChipLimit(){return Number(document.getElementById('cpu').value)||18;}
function seedA(){const p=Array(36).fill(null);p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'};p[2]={type:'turnR',kind:'action',next:'L'};p[7]={type:'aim',kind:'action',next:'R'};p[8]={type:'canShoot',kind:'cond',yes:'D',no:'L'};p[13]={type:'forward',kind:'action',next:'U'};p[14]={type:'weapon1',kind:'action',next:'L'};return p;}
function seedB(){const p=Array(36).fill(null);p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'};p[2]={type:'turnL',kind:'action',next:'L'};p[7]={type:'bulletNear',kind:'cond',yes:'R',no:'D'};p[8]={type:'evade',kind:'action',next:'L'};p[13]={type:'aim',kind:'action',next:'R'};p[14]={type:'canShoot',kind:'cond',yes:'R',no:'U'};p[15]={type:'weapon1',kind:'action',next:'L'};return p;}
function handDesignedChampion(side){return side==='B'?seedB():seedA();}function strategicSeeds(){return[seedA(),seedB()];}
function trimProgramToCpu(p){const n=cloneProgram(p),limit=cpuChipLimit(),keep=[];for(let i=1;i<36;i++)if(n[i])keep.push(i);for(const i of keep.slice(limit))n[i]=null;return n;}
</script>
