<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase D4 Checkpoint Test</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.run{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#e0a93c;color:#111;padding:9px 14px;min-height:42px;font-weight:700}.run:disabled{opacity:.55}#outerStatus{font-size:12px;opacity:.8}iframe{display:block;width:100%;height:calc(100vh - 72px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="runD4" class="run" disabled>Phase D4 実行</button><span id="outerStatus">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d4&v=20260824-d4base01" title="Phase D4 test"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('runD4'),st=document.getElementById('outerStatus');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;const old=d.getElementById('phaseRunBtn');if(old)old.style.display='none';const h=d.querySelector('h1');if(h)h.textContent='Phase D4：Validation checkpoint保存 + 完全未使用Test';const p=d.querySelector('h1 + p');if(p)p.textContent='D3のconstraint-dominationと未知遮蔽物評価を維持し、5世代ごとに固定Validationで最良checkpointをimmutable保存します。最終的にValidationで選ばれた1個体だけを、完全未使用の対戦相手・seed・ランダム遮蔽物でTestします。Test結果は選択へ戻しません。';const panel=d.querySelector('.panel:nth-of-type(2) .mini.warn');if(panel)panel.textContent='Testは最後に1回だけ実行し、選択・再探索・checkpoint更新には使用しません。';fetch('./phase-d4-evolution.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Phase D4 engine fetch failed');return r.text();}).then(src=>{if(!src.includes("phase-d4-checkpoint-test-v0.1"))throw new Error('D4エンジン版確認に失敗しました');w.eval(src);if(!w.__phaseD4||w.__phaseD4.VERSION!=='phase-d4-checkpoint-test-v0.1')throw new Error('D4初期化確認に失敗しました');btn.disabled=false;st.textContent='準備完了：D4 v0.1 / Standard 18・標準型で実行してください。';}).catch(e=>{console.error(e);st.textContent='Phase D4エンジン初期化失敗：'+(e.message||e);});}catch(e){st.textContent='初期化エラー：'+(e.message||e);}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow;if(!w.__phaseD4){st.textContent='D4エンジン未準備です。';return;}btn.disabled=true;st.textContent='Phase D4を実行中…';try{const r=await w.__phaseD4.run();st.textContent=r.pass?'Phase D4 PASS。選択checkpointと最終Testを確認してください。':'Phase D4 要確認。詳細レポートを確認してください。';}catch(e){console.error(e);st.textContent='Phase D4エラー：'+(e.message||e);}finally{btn.disabled=false;}});
</script></body></html>
