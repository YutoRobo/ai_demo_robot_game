<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase D3 v0.2 Generalization Validation</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.run{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#e0a93c;color:#111;padding:9px 14px;min-height:42px;font-weight:700}.run:disabled{opacity:.55}#outerStatus{font-size:12px;opacity:.8}iframe{display:block;width:100%;height:calc(100vh - 72px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="runD3" class="run" disabled>Phase D3 実行</button><span id="outerStatus">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d3v02&v=20260824-d3boards01" title="Phase D3 v0.2 test"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('runD3'),st=document.getElementById('outerStatus');
function installBoardViewer(w,d){
  if(d.getElementById('d3BoardPanel'))return;
  const style=d.createElement('style');style.textContent=`#d3BoardPanel{margin-top:14px}.d3BoardToolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.d3BoardToolbar select{min-height:38px}.d3BoardCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.d3BoardCard{background:#171a20;border:1px solid #3b414b;border-radius:12px;padding:10px}.d3BoardMeta{font-size:11px;opacity:.78;margin:4px 0 8px}.d3Grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;aspect-ratio:1/1}.d3Cell{position:relative;min-width:0;overflow:hidden;border:1px solid #414854;border-radius:6px;background:#252a31;padding:2px;font-size:8px;line-height:1.08}.d3Cell.start{background:#2e6f50;color:#fff}.d3Cell.action{background:#345f8a;color:#fff}.d3Cell.cond{background:#805d24;color:#fff}.d3Cell .nm{font-weight:700;display:block;word-break:break-all}.d3Cell .fl{position:absolute;right:2px;bottom:1px;font-weight:900}.d3Cell .yn{display:block;font-size:7px;margin-top:2px}.d3BoardNote{font-size:11px;opacity:.72;margin-top:8px}@media(max-width:760px){.d3BoardCards{grid-template-columns:1fr}.d3Cell{font-size:7px}}`;
  d.head.appendChild(style);
  const reportPanel=d.querySelector('#phaseReport')?.closest('.panel');if(!reportPanel)return;
  const panel=d.createElement('div');panel.id='d3BoardPanel';panel.className='panel';panel.innerHTML='<strong>進化個体の6×6ブロック構成</strong><div class="mini" style="margin-top:6px">各チェックポイントで、各クラスタの上位5個体を固定Validationし、その中でValidation成績が最も良い代表1個体を表示します。表示は観察用で、探索選択には使いません。</div><div class="d3BoardToolbar"><label class="mini">世代 <select id="d3BoardGen"></select></label></div><div id="d3BoardCards" class="d3BoardCards"></div><div class="d3BoardNote">青=Action、茶=Condition、緑=START。矢印は遷移方向、条件はY/Nの分岐方向です。</div>';
  reportPanel.parentNode.insertBefore(panel,reportPanel);
  const names={forward:'前進',back:'後退',turnL:'左旋回',turnR:'右旋回',strafeL:'左移動',strafeR:'右移動',aim:'照準',evade:'回避',weapon1:'武器1',weapon2:'武器2',flagOn:'旗ON',flagOff:'旗OFF',timerStart:'タイマー',wait:'待機',enemyFront:'正面',enemyNear:'近い',enemyFar:'遠い',enemyLeft:'敵左',enemyRight:'敵右',enemyInNarrowFov:'狭視野',enemyInMediumFov:'中視野',enemyInWideFov:'広視野',bulletNear:'弾接近',bulletLeft:'弾左',bulletRight:'弾右',hpLow:'HP低',hitRecent:'被弾',lostEnemy:'見失い',flagSet:'旗?',timer2s:'2秒',wallNear:'壁接近',canShoot:'射撃可',enemyFacingMe:'敵正対',behindEnemy:'敵背後',enemyWithin100:'100内',enemyWithin200:'200内',enemyWithin300:'300内',weapon1Ammo:'弾1?',weapon2Ammo:'弾2?'};
  const arrow={U:'↑',R:'→',D:'↓',L:'←'};
  function render(report,generation){const cp=report.checkpoints.find(x=>x.generation===Number(generation));const cards=d.getElementById('d3BoardCards');cards.innerHTML='';if(!cp?.representatives?.length){cards.innerHTML='<div class="mini">この世代のブロック記録はありません。</div>';return;}for(const r of cp.representatives){const card=d.createElement('div');card.className='d3BoardCard';const v=r.validation||{};card.innerHTML=`<strong>Cluster ${r.cluster}</strong><div class="d3BoardMeta">${r.weapons.join(' + ')} / reachable ${r.reachable} / Val勝率 ${((v.winRate||0)*100).toFixed(1)}% / Damage ${(v.avgDamage||0).toFixed(1)} / attacks ${(v.avgAttacks||0).toFixed(1)} / hash ${r.hash}</div>`;const grid=d.createElement('div');grid.className='d3Grid';for(let i=0;i<36;i++){const c=d.createElement('div');c.className='d3Cell';if(i===0){c.classList.add('start');c.innerHTML='<span class="nm">START</span><span class="fl">→</span>';}else{const chip=r.program[i];if(chip){c.classList.add(chip.kind);const nm=names[chip.type]||chip.type;if(chip.kind==='action')c.innerHTML=`<span class="nm">${nm}</span><span class="fl">${arrow[chip.next]||chip.next}</span>`;else c.innerHTML=`<span class="nm">${nm}</span><span class="yn">Y${arrow[chip.yes]||chip.yes} N${arrow[chip.no]||chip.no}</span>`;}}grid.appendChild(c);}card.appendChild(grid);cards.appendChild(card);}}
  w.__renderD3Boards=function(report){const sel=d.getElementById('d3BoardGen');sel.innerHTML='';for(const cp of report.checkpoints){const o=d.createElement('option');o.value=cp.generation;o.textContent=`世代 ${cp.generation}`;sel.appendChild(o);}const best=report.checkpoints.slice().sort((a,b)=>(b.validationLeaders?.winRate||0)-(a.validationLeaders?.winRate||0))[0];sel.value=String(best?.generation||report.checkpoints.at(-1)?.generation||20);sel.onchange=()=>render(report,sel.value);render(report,sel.value);};
}
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;const old=d.getElementById('phaseRunBtn');if(old)old.style.display='none';const h=d.querySelector('h1');if(h)h.textContent='Phase D3 v0.2：Engagement汎化・Strength安定性 300個体・6クラスタ・20世代';const p=d.querySelector('h1 + p');if(p)p.textContent='D2のconstraint-dominationを維持しつつ、選択に使わない別対戦相手・別seed・別ランダム遮蔽物のHeld-out Engagementと、5世代ごとの固定Strength Validationを計測します。完了後は代表個体の6×6ブロックも表示します。';const panel=d.querySelector('.panel:nth-of-type(2) .mini.warn');if(panel)panel.textContent='Held-outと固定Validationは選択には使用しません。未知遮蔽物への汎化と、同一条件での世代間Strength比較だけに使用します。';installBoardViewer(w,d);fetch('./phase-d3-evolution.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Phase D3 engine fetch failed');return r.text();}).then(src=>{if(!src.includes("phase-d3-generalization-v0.2"))throw new Error('古いD3エンジンを検出しました');if(src.includes('checkpoint={generation:g+1,calibrationFeasible:calFeasible.length,heldoutFeasibleAll,'))throw new Error('旧heldoutFeasibleAllバグを検出しました');const oldLv='const lvAgg=aggregateMetrics(leaderValidation.map(x=>x.metrics));';const newLv=`const lvAgg=aggregateMetrics(leaderValidation.map(x=>x.metrics));\n          const visualRepresentatives=Array.from({length:K},(_,cluster)=>{const cand=leaderValidation.filter(z=>z.cluster===cluster).slice().sort((a,b)=>{for(const key of ['wins','damage','resolved','margin']){const av=a.metrics?.[key]||0,bv=b.metrics?.[key]||0;if(av!==bv)return bv-av;}return String(a.id).localeCompare(String(b.id));});const best=cand[0],srcInd=leaders.find(q=>q.id===best?.id);return srcInd?{cluster,id:srcInd.id,hash:srcInd.hash,weapons:srcInd.weapons.slice(),reachable:E().structureHealth(srcInd.program).reachable,program:clone(srcInd.program),validation:best.metrics}:null;}).filter(Boolean);`;
const oldCp='validationLeaders:{count:leaderValidation.length,winRate:lvAgg.winRate,resolvedRate:lvAgg.resolvedRate,avgDamage:lvAgg.avgDamage,avgAttacks:lvAgg.avgAttacks}};';const newCp='validationLeaders:{count:leaderValidation.length,winRate:lvAgg.winRate,resolvedRate:lvAgg.resolvedRate,avgDamage:lvAgg.avgDamage,avgAttacks:lvAgg.avgAttacks},representatives:visualRepresentatives};';if(!src.includes(oldLv)||!src.includes(oldCp))throw new Error('D3 block-view patch marker not found');src=src.replace(oldLv,newLv).replace(oldCp,newCp);w.eval(src);if(!w.__phaseD3||w.__phaseD3.VERSION!=='phase-d3-generalization-v0.2')throw new Error('D3 v0.2初期化確認に失敗しました');btn.disabled=false;st.textContent='準備完了：D3 v0.2（代表ブロック表示対応）';}).catch(e=>{console.error(e);st.textContent='Phase D3エンジン初期化失敗：'+(e.message||e);});}catch(e){st.textContent='初期化エラー：'+(e.message||e);}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow;if(!w.__phaseD3||w.__phaseD3.VERSION!=='phase-d3-generalization-v0.2'){st.textContent='D3 v0.2エンジン未準備です。';return;}btn.disabled=true;st.textContent='Phase D3 v0.2を実行中…';try{const r=await w.__phaseD3.run();if(w.__renderD3Boards)w.__renderD3Boards(r);st.textContent=r.pass?'Phase D3 PASS。代表ブロック構成も表示しました。':'Phase D3 要確認。詳細レポートを確認してください。';}catch(e){console.error(e);st.textContent='Phase D3エラー：'+(e.message||e);}finally{btn.disabled=false;}});
</script></body></html>
