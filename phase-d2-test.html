<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase D2 Engagement Constraint</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.run{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#e0a93c;color:#111;padding:9px 14px;min-height:42px;font-weight:700}.run:disabled{opacity:.55}#outerStatus{font-size:12px;opacity:.8}iframe{display:block;width:100%;height:calc(100vh - 72px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="runD2" class="run" disabled>Phase D2 実行</button><span id="outerStatus">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d2&v=20260824-d2base01" title="Phase D2 test"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('runD2'),st=document.getElementById('outerStatus');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;const old=d.getElementById('phaseRunBtn');if(old)old.style.display='none';const h=d.querySelector('h1');if(h)h.textContent='Phase D2：Engagement Constraint 300個体・6クラスタ・20世代';const p=d.querySelector('h1 + p');if(p)p.textContent='Phase Dと同じauthoritative-measured-v2実戦評価器を使い、固定4試合のEngagement校正を強さ評価から分離します。構造制約→Engagement制約→強さ比較のconstraint-dominationを検証します。';const s=d.createElement('script');s.src='./phase-d2-evolution.js?v=20260824-d2eng01';s.onload=()=>{btn.disabled=false;st.textContent='準備完了：Standard 18 / 標準型で実行してください。';};s.onerror=()=>{st.textContent='Phase D2エンジンの読み込みに失敗しました。';};d.body.appendChild(s);}catch(e){st.textContent='初期化エラー：'+(e.message||e);}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow;if(!w.__phaseD2){st.textContent='Phase D2エンジン未準備です。';return;}btn.disabled=true;st.textContent='Phase D2を実行中…';try{const r=await w.__phaseD2.run();st.textContent=r.pass?'Phase D2 PASS。詳細レポートを確認してください。':'Phase D2 要確認。詳細レポートを確認してください。';}catch(e){console.error(e);st.textContent='Phase D2エラー：'+(e.message||e);}finally{btn.disabled=false;}});
</script></body></html>
