<script>
(()=>{

const startBtn=root.querySelector('#startBtn'),resetBtn=root.querySelector('#resetBtn'),shareBtn=root.querySelector('#shareBtn'),eraseBtn=root.querySelector('#eraseBtn'),sampleBtn=root.querySelector('#sampleBtn'),optimizeBtn=root.querySelector('#optimizeBtn'),editA=root.querySelector('#editA'),editB=root.querySelector('#editB'),settingsEditA=root.querySelector('#settingsEditA'),settingsEditB=root.querySelector('#settingsEditB'),battleScreenBtn=root.querySelector('#battleScreenBtn'),settingsScreenBtn=root.querySelector('#settingsScreenBtn'),speedSel=root.querySelector('#speedSel'),weaponA1Sel=root.querySelector('#weaponA1Sel'),weaponA2Sel=root.querySelector('#weaponA2Sel'),weaponB1Sel=root.querySelector('#weaponB1Sel'),weaponB2Sel=root.querySelector('#weaponB2Sel'),weaponPanelTitle=root.querySelector('#weaponPanelTitle'),maxGenInput=root.querySelector('#maxGenInput');
const hpAbar=root.querySelector('#hpAbar'),hpBbar=root.querySelector('#hpBbar'),hpAtext=root.querySelector('#hpAtext'),hpBtext=root.querySelector('#hpBtext'),fovAinfo=root.querySelector('#fovAinfo'),fovBinfo=root.querySelector('#fovBinfo'),evoProgress=root.querySelector('#evoProgress'),evoGen=root.querySelector('#evoGen'),evoBattles=root.querySelector('#evoBattles'),evoBest=root.querySelector('#evoBest'),evoDetail=root.querySelector('#evoDetail');
const dirs=[['U','↑'],['R','→'],['D','↓'],['L','←']],chipTypes=[['forward','前進','action'],['back','後退','action'],['turnL','左旋回','action'],['turnR','右旋回','action'],['strafeL','左移動','action'],['strafeR','右移動','action'],['aim','照準','action'],['evade','回避','action'],['weapon1','武器1使用','action'],['weapon2','武器2使用','action'],['flagOn','フラグON','action'],['flagOff','フラグOFF','action'],['timerStart','タイマー開始','action'],['wait','待機','action'],['enemyFront','IF 正面','cond'],['enemyNear','IF 近い','cond'],['enemyFar','IF 遠い','cond'],['enemyLeft','IF 敵左','cond'],['enemyRight','IF 敵右','cond'],['enemyInNarrowFov','IF 狭視野検知','cond'],['enemyInMediumFov','IF 中視野検知','cond'],['enemyInWideFov','IF 広視野検知','cond'],['bulletNear','IF 弾接近','cond'],['bulletLeft','IF 弾左','cond'],['bulletRight','IF 弾右','cond'],['hpLow','IF HP低下','cond'],['hitRecent','IF 被弾直後','cond'],['lostEnemy','IF 見失い','cond'],['flagSet','IF フラグON','cond'],['timer2s','IF 2秒経過','cond'],['wallNear','IF 壁接近','cond'],['canShoot','IF 射撃可','cond']];
let programs={A:Array(36).fill(null),B:Array(36).fill(null)},editSide='A',selectedType='forward',selectedCell=0,state,running=false,last=performance.now(),bullets=[],mines=[],obstacles=[],A,B,lastOptimized=null;
function bot(x,y,ang){return{x,y,ang,hp:100,cd:0,r:18,killerReady:true,mineStock:3,ammo:{rifle:12,burst:6,heavy:5,rapid:28}}}function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}function nextCell(index,dir){const x=index%6,y=Math.floor(index/6);if(dir==='U'&&y>0)return index-6;if(dir==='D'&&y<5)return index+6;if(dir==='L'&&x>0)return index-1;if(dir==='R'&&x<5)return index+1;return index}function cloneProgram(p){return p.map(c=>c?{...c}:null)}function randomDir(rng=Math.random){return dirs[Math.floor(rng()*4)][0]}function randomChip(rng=Math.random){const d=chipTypes[Math.floor(rng()*chipTypes.length)];return d[2]==='action'?{type:d[0],kind:'action',next:randomDir(rng)}:{type:d[0],kind:'cond',yes:randomDir(rng),no:randomDir(rng)}}function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function circleRectHit(x,y,r,o){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));return Math.hypot(x-cx,y-cy)<r}function randomObstacles(rng=Math.random){const obs=[],count=2+Math.floor(rng()*4);for(let n=0;n<count;n++){for(let t=0;t<80;t++){const w=65+rng()*75,h=45+rng()*70,x=45+rng()*(cv.width-w-90),y=45+rng()*(cv.height-h-90),o={x,y,w,h};if(obs.every(q=>x+w+28<q.x||q.x+q.w+28<x||y+h+28<q.y||q.y+q.h+28<y)){obs.push(o);break}}}return obs}function segmentIntersectsRect(a,b,o){const dx=b.x-a.x,dy=b.y-a.y;let t0=0,t1=1;for(const [p,q] of [[-dx,a.x-o.x],[dx,o.x+o.w-a.x],[-dy,a.y-o.y],[dy,o.y+o.h-a.y]]){if(Math.abs(p)<1e-9){if(q<0)return false;continue}const r=q/p;if(p<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}return t1>=t0&&t1>0&&t0<1}function lineBlocked(a,b,obs){return obs.some(o=>segmentIntersectsRect(a,b,o))}
function handDesignedChampion(side){const p=Array(36).fill(null);if(side==='A'){p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'};p[2]={type:'enemyInMediumFov',kind:'cond',yes:'D',no:'R'};p[3]={type:'wallNear',kind:'cond',yes:'D',no:'R'};p[4]={type:'forward',kind:'action',next:'D'};p[9]={type:'turnR',kind:'action',next:'U'};p[10]={type:'turnL',kind:'action',next:'U'};p[7]={type:'enemyInNarrowFov',kind:'cond',yes:'R',no:'D'};p[8]={type:'bulletNear',kind:'cond',yes:'D',no:'R'};p[14]={type:'evade',kind:'action',next:'U'};p[15]={type:'enemyNear',kind:'cond',yes:'D',no:'R'};p[16]={type:'canShoot',kind:'cond',yes:'D',no:'R'};p[21]={type:'weapon2',kind:'action',next:'R'};p[22]={type:'aim',kind:'action',next:'U'};p[34]={type:'weapon1',kind:'action',next:'U'};p[35]={type:'strafeR',kind:'action',next:'L'}}else{p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'};p[7]={type:'enemyInMediumFov',kind:'cond',yes:'R',no:'D'};p[13]={type:'wallNear',kind:'cond',yes:'R',no:'D'};p[14]={type:'turnL',kind:'action',next:'U'};p[19]={type:'forward',kind:'action',next:'U'};p[8]={type:'bulletNear',kind:'cond',yes:'D',no:'R'};p[9]={type:'enemyNear',kind:'cond',yes:'D',no:'R'};p[10]={type:'enemyInNarrowFov',kind:'cond',yes:'D',no:'R'};p[11]={type:'canShoot',kind:'cond',yes:'D',no:'L'};p[15]={type:'evade',kind:'action',next:'U'};p[16]={type:'weapon2',kind:'action',next:'R'};p[17]={type:'aim',kind:'action',next:'L'};p[22]={type:'weapon1',kind:'action',next:'U'};p[21]={type:'back',kind:'action',next:'U'};p[35]={type:'aim',kind:'action',next:'L'}}return p}
function strategicSeeds(){return[handDesignedChampion('A'),handDesignedChampion('B')]}function randomProgram(rng=Math.random){const p=Array(36).fill(null);p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'};for(let i=2;i<12;i++)if(rng()<.8)p[i]=randomChip(rng);return p}function weaponAwareSeeds(){return[...strategicSeeds(),randomProgram(seeded(1)),randomProgram(seeded(2)),randomProgram(seeded(3))]}
function simulateBattleWeaponAware(pa,pb,seed,a1,a2,b1,b2){const rng=seeded(seed),obs=randomObstacles(rng),mk=()=>({x:55+rng()*(cv.width-110),y:55+rng()*(cv.height-110),ang:rng()*Math.PI*2,hp:100,cd:0,r:18,killerReady:true,mineStock:3,ammo:{rifle:12,burst:6,heavy:5,rapid:28}}),bots={A:mk(),B:mk()},ss={A:{pc:0,lastSeen:0,lockTime:0,flag:false,timer:0},B:{pc:0,lastSeen:0,lockTime:0,flag:false,timer:0}},profiles={A:[a1,a2],B:[b1,b2]},shots=[],simMines=[];const me=s=>bots[s],op=s=>bots[s==='A'?'B':'A'];function detect(side){const m=me(side),o=op(side),dd=Math.hypot(m.x-o.x,m.y-o.y),signed=norm(Math.atan2(o.y-m.y,o.x-m.x)-m.ang),diff=Math.abs(signed),los=!lineBlocked(m,o,obs);return{dd,signed,diff,narrow:los&&diff<=20*Math.PI/180&&dd<=330,medium:los&&diff<=45*Math.PI/180&&dd<=245,wide:los&&diff<=75*Math.PI/180&&dd<=170}}function cond(side,c){const m=me(side),v=detect(side),vis=v.narrow||v.medium||v.wide;if(c==='enemyFront')return vis&&v.diff<22*Math.PI/180;if(c==='enemyNear')return vis&&v.dd<150;if(c==='enemyFar')return vis&&v.dd>220;if(c==='enemyLeft')return vis&&v.signed<0;if(c==='enemyRight')return vis&&v.signed>0;if(c==='enemyInNarrowFov')return v.narrow;if(c==='enemyInMediumFov')return v.medium;if(c==='enemyInWideFov')return v.wide;if(c==='hpLow')return m.hp<40;if(c==='canShoot')return m.cd<=0&&vis&&v.diff<18*Math.PI/180;if(c==='wallNear')return m.x<65||m.x>cv.width-65||m.y<65||m.y>cv.height-65||obs.some(o=>circleRectHit(m.x,m.y,58,o));if(c==='flagSet')return ss[side].flag;if(c==='timer2s')return ss[side].timer>=2;if(c==='lostEnemy')return !vis&&ss[side].lastSeen>1;return false}function mv(o,f,s,t){o.ang=norm(o.ang+t*.252);const ox=o.x,oy=o.y;o.x+=(Math.cos(o.ang)*f+Math.cos(o.ang+Math.PI/2)*s)*12.6;o.y+=(Math.sin(o.ang)*f+Math.sin(o.ang+Math.PI/2)*s)*12.6;o.x=Math.max(24,Math.min(cv.width-24,o.x));o.y=Math.max(24,Math.min(cv.height-24,o.y));if(obs.some(z=>circleRectHit(o.x,o.y,o.r,z))){o.x=ox;o.y=oy}}function fire(side,w){const m=me(side),s=ss[side];if(w==='mine'){ async function optimizeHybrid(maxGenerations=1000){running=false;optimizeBtn.disabled=true;statusEl.textContent='Train / Validation / Baseline 分離で探索中…';const weaponList=['rifle','burst','heavy','rapid','mine','killer'],weaponName={rifle:'ライフル',burst:'バースト',heavy:'ヘビー弾',rapid:'速射砲',mine:'地雷',killer:'強化弾'},ITER=maxGenerations,QUICK=6,VAL=18,FINAL=80;let battleCount=0;function cfg(p,w1,w2){return{p:cloneProgram(p),w1,w2}}function sim(a,b,seed){return simulateBattleWeaponAware(a.p,b.p,seed,a.w1,a.w2,b.w1,b.w2)}function mutate(v){const n=cfg(v.p,v.w1,v.w2),r=Math.random();if(r<.08)n.w1=weaponList[Math.floor(Math.random()*6)];else if(r<.16)n.w2=weaponList[Math.floor(Math.random()*6)];else{const pos=1+Math.floor(Math.random()*35);n.p[pos]=Math.random()<.2?null:randomChip();if(!n.p[1])n.p[1]={type:'enemyInWideFov',kind:'cond',yes:'D',no:'R'}}return n}function scoreAgainst(v,opps,seeds,count){let w=0,d=0,l=0,margin=0,resolved=0;for(let i=0;i<count;i++){const q=opps[i%opps.length],seed=seeds[i%seeds.length],r1=sim(v,q,seed),r2=sim(q,v,seed);if(r1.winner>0)w++;else if(r1.winner<0)l++;else d++;if(r2.winner<0)w++;else if(r2.winner>0)l++;else d++;margin+=r1.a-r1.b+r2.b-r2.a;if(r1.resolved)resolved++;if(r2.resolved)resolved++;battleCount+=2}const games=count*2,wr=w/games,m=Math.max(-1,Math.min(1,margin/(games*100))),rr=resolved/games;return{score:1000*(.94*wr+.035*((m+1)/2)+.025*rr),w,d,l,wr}}const starters=[];for(const p of weaponAwareSeeds())for(const w1 of weaponList)for(const w2 of weaponList)starters.push(cfg(p,w1,w2));const baselineProfiles=[cfg(handDesignedChampion('A'),'rifle','mine'),cfg(handDesignedChampion('A'),'heavy','rapid'),cfg(handDesignedChampion('B'),'burst','killer'),cfg(handDesignedChampion('B'),'rapid','mine')],trainOpp=starters.filter((_,i)=>i%13===0).slice(0,24),trainSeeds=Array.from({length:QUICK},(_,i)=>810000000+i*977),valSeeds=Array.from({length:VAL},(_,i)=>1210000000+i*10007),baselineSeeds=Array.from({length:VAL},(_,i)=>1310000000+i*12011);let scored=st
