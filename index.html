<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111317"><title>ロボットAIバトル v1</title><style>html,body{margin:0;min-height:100%;background:#111317;color:#fff;font-family:system-ui,sans-serif}.boot{padding:24px}</style></head><body><div class="boot">ロボットAIバトルを起動中…</div><script>(async()=>{try{const [core,opt]=await Promise.all([fetch('./game-core.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('game-core.html '+r.status);return r.text()}),fetch('./optimizer-advanced.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('optimizer-advanced.js '+r.status);return r.text()})]);const marker="editA.addEventListener('click',()=>{editSide='A';selectedCell=0;renderProgram();});";if(!core.includes(marker))throw new Error('optimizer injection marker not found');const html=core.replace(marker,opt+'\n'+marker);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><b>起動エラー</b><br>'+String(e.message||e)+'</div>';console.error(e)}})();</script></body></html>
