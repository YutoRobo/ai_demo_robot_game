<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111317"><title>ロボットAIバトル v1</title><style>html,body{margin:0;min-height:100%;background:#111317;color:#fff;font-family:system-ui,sans-serif}.boot{padding:24px}</style></head><body><div class="boot">ロボットAIバトルを起動中…</div><script>(async()=>{try{const stamp='20260823-2135';const [core,opt,gate,cpu,chassis]=await Promise.all([fetch('./game-core.html?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('game-core.html '+r.status);return r.text()}),fetch('./optimizer-advanced.js?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('optimizer-advanced.js '+r.status);return r.text()}),fetch('./optimizer-champion-gate.js?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('optimizer-champion-gate.js '+r.status);return r.text()}),fetch('./cpu-rules.js?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('cpu-rules.js '+r.status);return r.text()}),fetch('./chassis-rules.js?v='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('chassis-rules.js '+r.status);return r.text()})]);let patchedCore=core;const liveOld="function runAI(side,dt){const s=state[side];s.acc+=dt;if(s.acc<.12)return;s.acc=0;execute(side);}",liveNew="function runAI(side,dt){const s=state[side],period=typeof cpuDecisionPeriod==='function'?cpuDecisionPeriod():.12;s.acc+=dt;if(s.acc+1e-9<period)return;s.acc=0;execute(side);}";if(!patchedCore.includes(liveOld))throw new Error('CPU live timing marker not found');patchedCore=patchedCore.replace(liveOld,liveNew);const simTickOld="const dt=.12;let resolved=false;for(let tick=0;tick<520&&bots.A.hp>0&&bots.B.hp>0;tick++){",simTickNew="const dt=.04,decisionPeriod=typeof cpuDecisionPeriod==='function'?cpuDecisionPeriod():.12;let decisionAcc={A:0,B:0},resolved=false;for(let tick=0;tick<1560&&bots.A.hp>0&&bots.B.hp>0;tick++){",simExecOld="exec('A',pa);exec('B',pb);",simExecNew="for(const side of ['A','B']){decisionAcc[side]+=dt;if(decisionAcc[side]+1e-9>=decisionPeriod){decisionAcc[side]=0;exec(side,side==='A'?pa:pb);}}";if(!patchedCore.includes(simTickOld)||!patchedCore.includes(simExecOld))throw new Error('CPU simulation timing marker not found');patchedCore=patchedCore.replaceAll(simTickOld,simTickNew).replaceAll(simExecOld,simExecNew);const simMkOld="const mk=(x,y)=>({x,y,ang:rng()*Math.PI*2,hp:100,cd:0,r:18,killerReady:true,mineStock:3,ammo:{rifle:12,burst:6,heavy:5,rapid:28}}),bots={A:mk(ax,ay),B:mk(bx,by)}",simMkNew="const mk=(x,y,side)=>{const c=typeof chassisStats==='function'?chassisStats(side):{hp:100,move:1,strafe:1,turn:1};return{x,y,ang:rng()*Math.PI*2,hp:c.hp,maxHp:c.hp,moveMul:c.move,strafeMul:c.strafe,turnMul:c.turn,cd:0,r:18,killerReady:true,mineStock:3,ammo:{rifle:12,burst:6,heavy:5,rapid:28}}},bots={A:mk(ax,ay,'A'),B:mk(bx,by,'B')}";const simMvOld="function mv(o,f,st,t,dt){o.ang=nrm(o.ang+t*2.1*dt);const sp=105,ox=o.x,oy=o.y;o.x+=(Math.cos(o.ang)*f+Math.cos(o.ang+Math.PI/2)*st)*sp*dt;o.y+=(Math.sin(o.ang)*f+Math.sin(o.ang+Math.PI/2)*st)*sp*dt;o.x=Math.max(24,Math.min(cv.width-24,o.x));o.y=Math.max(24,Math.min(cv.height-24,o.y));if(obs.some(ob=>circleRectHit(o.x,o.y,o.r,ob))){o.x=ox;o.y=oy;}}",simMvNew="function mv(o,f,st,t,dt){o.ang=nrm(o.ang+t*2.1*(o.turnMul||1)*dt);const sp=105,ox=o.x,oy=o.y,moveMul=o.moveMul||1,strafeMul=o.strafeMul||1;o.x+=(Math.cos(o.ang)*f*moveMul+Math.cos(o.ang+Math.PI/2)*st*strafeMul)*sp*dt;o.y+=(Math.sin(o.ang)*f*moveMul+Math.sin(o.ang+Math.PI/2)*st*strafeMul)*sp*dt;o.x=Math.max(24,Math.min(cv.width-24,o.x));o.y=Math.max(24,Math.min(cv.height-24,o.y));if(obs.some(ob=>circleRectHit(o.x,o.y,o.r,ob))){o.x=ox;o.y=oy;}}";if(!patchedCore.includes(simMkOld)||!patchedCore.includes(simMvOld))throw new Error('chassis simulation marker not found');patchedCore=patchedCore.replaceAll(simMkOld,simMkNew).replaceAll(simMvOld,simMvNew);const hpOld="hpAbar.style.width=A.hp+'%';hpBbar.style.width=B.hp+'%';",hpNew="hpAbar.style.width=(100*A.hp/(A.maxHp||100))+'%';hpBbar.style.width=(100*B.hp/(B.maxHp||100))+'%';";if(!patchedCore.includes(hpOld))throw new Error('chassis HP marker not found');patchedCore=patchedCore.replace(hpOld,hpNew);const start='async function optimizeHybrid(maxGenerations=1000){';const end='function handDesignedChampion(side){';const i0=patchedCore.indexOf(start),i1=patchedCore.indexOf(end,i0);if(i0<0||i1<0)throw new Error('optimizer replacement markers not found');const advanced=opt.replace('optimizeHybrid = async function','let optimizeHybrid = async function').trim();const html=patchedCore.slice(0,i0)+cpu.trim()+'\n'+chassis.trim()+'\n'+advanced+'\n'+gate.trim()+'\n'+patchedCore.slice(i1);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot"><b>起動エラー</b><br>'+String(e.message||e)+'</div>';console.error(e)}})();</script></body></html>
