<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase D3 Generalization Validation</title><style>html,body{margin:0;background:#111317;color:#f1f3f5;font-family:system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:14px 18px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.run{font:inherit;border-radius:9px;border:1px solid #4a515d;background:#e0a93c;color:#111;padding:9px 14px;min-height:42px;font-weight:700}.run:disabled{opacity:.55}#outerStatus{font-size:12px;opacity:.8}iframe{display:block;width:100%;height:calc(100vh - 72px);border:0;background:#111317}</style></head><body><header><div class="bar"><button id="runD3" class="run" disabled>Phase D3 実行</button><span id="outerStatus">読み込み中…</span></div></header><iframe id="frame" src="./phase-d-test.html?embedded=d3&v=20260824-d3base01" title="Phase D3 test"></iframe><script>
const frame=document.getElementById('frame'),btn=document.getElementById('runD3'),st=document.getElementById('outerStatus');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;const old=d.getElementById('phaseRunBtn');if(old)old.style.display='none';const h=d.querySelector('h1');if(h)h.textContent='Phase D3：Engagement汎化・Strength安定性 300個体・6クラスタ・20世代';const p=d.querySelector('h1 + p');if(p)p.textContent='D2のconstraint-dominationを維持しつつ、選択に使わない別対戦相手・別seed・別ランダム遮蔽物のHeld-out Engagementと、5世代ごとの固定Strength Validationを計測します。';const panel=d.querySelector('.panel:nth-of-type(2) .mini.warn');if(panel)panel.textContent='Held-outと固定Validationは選択には使用しません。未知遮蔽物への汎化と、同一条件での世代間Strength比較だけに使用します。';fetch('./phase-d3-evolution.js?v=20260824-d3gen02',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Phase D3 engine fetch failed');return r.text();}).then(src=>{const before='checkpoint={generation:g+1,calibrationFeasible:calFeasible.length,heldoutFeasibleAll,';const after='checkpoint={generation:g+1,calibrationFeasible:calFeasible.length,heldoutFeasibleAll:heldFeasibleAll,';if(!src.includes(before))throw new Error('Phase D3 patch marker not found');src=src.replace(before,after);w.eval(src);btn.disabled=false;st.textContent='準備完了：D3修正版。Standard 18 / 標準型で実行してください。';}).catch(e=>{console.error(e);st.textContent='Phase D3エンジン初期化失敗：'+(e.message||e);});}catch(e){st.textContent='初期化エラー：'+(e.message||e);}});
btn.addEventListener('click',async()=>{const w=frame.contentWindow;if(!w.__phaseD3){st.textContent='Phase D3エンジン未準備です。';return;}btn.disabled=true;st.textContent='Phase D3を実行中…';try{const r=await w.__phaseD3.run();st.textContent=r.pass?'Phase D3 PASS。Held-outとValidationの詳細レポートを確認してください。':'Phase D3 要確認。詳細レポートを確認してください。';}catch(e){console.error(e);st.textContent='Phase D3エラー：'+(e.message||e);}finally{btn.disabled=false;}});
</script></body></html>
